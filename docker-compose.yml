services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: siblog-app
    container_name: siblog-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - siblog-network

  web:
    image: nginx:alpine
    container_name: siblog-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - siblog-network

  db:
    image: mysql:8.0
    container_name: siblog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-SiBlog}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_USER: ${DB_USERNAME:-dapit}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - siblog-network

networks:
  siblog-network:
    driver: bridge

volumes:
  db-data:
